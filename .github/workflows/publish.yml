name: Publish Package

# Manual only. npm trusted publishing rejects this repo's OIDC tokens since the GitHub account
# rename (ufbfung -> briankfung, 2026-10-10): renamed repos get GitHub's immutable subject format
# (repo:owner@id/repo@id) and npm answers "OIDC permission denied". Publish from a laptop with
# `npm publish --access public` until npm accepts immutable subjects, then restore the tag trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Publish
        run: npm publish --access public
